[project]
name = "maryland-manual-network"
version = "0.1.0"
description = "The Maryland Manual reimagined as a network of governments, for reporters."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "jinja2>=3.1",
    "click>=8.1",
]

[project.optional-dependencies]
enrich = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "datasette>=0.64"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["crawler", "extract", "graph", "site", "enrich"]
